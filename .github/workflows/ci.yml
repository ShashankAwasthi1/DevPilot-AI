name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # Dummy, non-secret values - NEXT_PUBLIC_* variables are inlined into
      # the browser bundle at build time and are never sensitive by design.
      # CI never talks to a real backend or a real production site.
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
      NEXT_PUBLIC_SITE_URL: https://devpilot.example.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Check for whitespace errors
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Harmless placeholder connection strings. No PostgreSQL service runs
      # in this workflow - `npm ci`'s postinstall (`prisma generate`) only
      # generates client code from schema.prisma, it never connects to a
      # database, and the server test suite mocks Prisma everywhere, so
      # nothing here is ever dialed.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Check for whitespace errors
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
